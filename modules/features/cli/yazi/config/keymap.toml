#:schema https://yazi-rs.github.io/schemas/keymap.json

# Only changes to yazi's preset keymap (yazi-config/preset/keymap-default.toml
# upstream): a prepended binding wins over the preset's on the same key, and
# every other preset binding stays, including ones added by later releases.

[mgr]

[[mgr.prepend_keymap]]
on = "Q"
run = "quit"
desc = "Quit the process"

[[mgr.prepend_keymap]]
on = "q"
run = "quit --no-cwd-file"
desc = "Quit without outputting cwd-file"

[[mgr.prepend_keymap]]
on = "w"
run = "close"
desc = "Close the current tab, or quit if it's last"

[[mgr.prepend_keymap]]
on = "<C-o>"
run = "back"
desc = "Go back to the previous directory"

[[mgr.prepend_keymap]]
on = "<C-i>"
run = "forward"
desc = "Go forward to the next directory"

[[mgr.prepend_keymap]]
on = "<Space>"
run = ["toggle", "arrow next"]
desc = "Toggle the current selection state"

[[mgr.prepend_keymap]]
on = "o"
run = "open --interactive"
desc = "Open selected files interactively"

[[mgr.prepend_keymap]]
on = "<C-f>"
run = "search --via=fd"
desc = "Search files by name via fd"

[[mgr.prepend_keymap]]
on = "<C-g>"
run = "search --via=rg"
desc = "Search files by content via ripgrep"

[[mgr.prepend_keymap]]
on = "s"
run = "plugin fzf"
desc = "Jump to a file/directory via fzf"

[[mgr.prepend_keymap]]
on = "z"
run = "plugin zoxide"
desc = "Jump to a directory via zoxide"

[[mgr.prepend_keymap]]
on = ["g", "a"]
run = "cd $ATLAS_PATH"
desc = "Go to Atlas vault"

[[mgr.prepend_keymap]]
on = ["g", "C"]
run = "cd ~/dotfiles"
desc = "Go ~/dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Desktop"
desc = "Go ~/Desktop"

[[mgr.prepend_keymap]]
on = "t"
run = "tab_create --current"
desc = "Create a new tab with CWD"

[[mgr.prepend_keymap]]
on = "T"
run = "tasks:show"
desc = "Show task manager"

[[mgr.prepend_keymap]]
on = ["g", "?"]
run = "help"
desc = "Open help"

[[mgr.prepend_keymap]]

on = ["g", "r"]
run = '''
  shell 'ya emit cd --str "$(git rev-parse --show-toplevel)"' --confirm
'''
desc = "Go back to root of Git repo"

[[mgr.prepend_keymap]]
on = [",", "c"]
run = "plugin vcs-files"
desc = "Show Git file changes"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]

on = "<C-y>"
run = ["plugin system-clipboard"]

[[mgr.prepend_keymap]]
on = ["c", "a", "a"]
run = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on = ["c", "a", "p"]
run = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on = ["c", "a", "h"]
run = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on = ["c", "a", "l"]
run = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on = ["c", "a", "u"]
run = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"

[input]

[[input.prepend_keymap]]
on = "L"
run = "move eol"
desc = "Move to the EOL"

[[input.prepend_keymap]]
on = "H"
run = "move first-char"
desc = "Move to the first non-whitespace character"

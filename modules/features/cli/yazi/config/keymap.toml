#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
  { on = "Q", run = "quit", desc = "Quit the process" },
  { on = "q", run = "quit --no-cwd-file", desc = "Quit without outputting cwd-file" },
  { on = "w", run = "close", desc = "Close the current tab, or quit if it's last" },
  { on = "<C-o>", run = "back", desc = "Go back to the previous directory" },
  { on = "<C-i>", run = "forward", desc = "Go forward to the next directory" },
  { on = "<Space>", run = [
    "toggle",
    "arrow next",
  ], desc = "Toggle the current selection state" },
  { on = "o", run = "open --interactive", desc = "Open selected files interactively" },
  { on = "<C-f>", run = "search --via=fd", desc = "Search files by name via fd" },
  { on = "<C-g>", run = "search --via=rg", desc = "Search files by content via ripgrep" },
  { on = "s", run = "plugin fzf", desc = "Jump to a file/directory via fzf" },
  { on = "z", run = "plugin zoxide", desc = "Jump to a directory via zoxide" },
  { on = [
    "g",
    "a",
  ], run = "cd $ATLAS_PATH", desc = "Go to Atlas vault" },
  { on = [
    "g",
    "D",
  ], run = "cd ~/Desktop", desc = "Go ~/Desktop" },
  { on = "T", run = "tasks:show", desc = "Show task manager" },
  { on = [
    "g",
    "?",
  ], run = "help", desc = "Open help" },
  { on = [
    "g",
    "r",
  ], run = "shell 'ya emit cd --str \"$(git rev-parse --show-toplevel)\"'", desc = "Go back to root of Git repo" },
  { on = [
    ",",
    "c",
  ], run = "plugin vcs-files", desc = "Show Git file changes" },
  { on = [
    "c",
    "m",
  ], run = "plugin chmod", desc = "Chmod on selected files" },
  { on = "<C-y>", run = [
    "plugin system-clipboard",
  ] },
  { on = [
    "c",
    "a",
    "a",
  ], run = "plugin compress", desc = "Archive selected files" },
  { on = [
    "c",
    "a",
    "p",
  ], run = "plugin compress -p", desc = "Archive selected files (password)" },
  { on = [
    "c",
    "a",
    "h",
  ], run = "plugin compress -ph", desc = "Archive selected files (password+header)" },
  { on = [
    "c",
    "a",
    "l",
  ], run = "plugin compress -l", desc = "Archive selected files (compression level)" },
  { on = [
    "c",
    "a",
    "u",
  ], run = "plugin compress -phl", desc = "Archive selected files (password+header+level)" },

  { on = "<C-[>", run = "noop" },
  { on = "<C-c>", run = "noop" },
  { on = "<Up>", run = "noop" },
  { on = "<Down>", run = "noop" },
  { on = "<C-b>", run = "noop" },
  { on = "<S-PageUp>", run = "noop" },
  { on = "<S-PageDown>", run = "noop" },
  { on = "<PageUp>", run = "noop" },
  { on = "<PageDown>", run = "noop" },
  { on = "<Left>", run = "noop" },
  { on = "<Right>", run = "noop" },
  { on = "H", run = "noop" },
  { on = "L", run = "noop" },
  { on = "O", run = "noop" },
  { on = "<S-Enter>", run = "noop" },
  { on = "S", run = "noop" },
  { on = "Z", run = "noop" },
  { on = "~", run = "noop" },
  { on = "<F1>", run = "noop" },
]

[tasks]
prepend_keymap = [
  { on = "w", run = "noop" },
  { on = "<Up>", run = "noop" },
  { on = "<Down>", run = "noop" },
]

[spot]
prepend_keymap = [
  { on = "<Up>", run = "noop" },
  { on = "<Down>", run = "noop" },
  { on = "<Left>", run = "noop" },
  { on = "<Right>", run = "noop" },
]

[pick]
prepend_keymap = [{ on = "<C-[>", run = "noop" }]

[input]
prepend_keymap = [
  { on = "L", run = "move eol", desc = "Move to the EOL" },
  { on = "H", run = "move first-char", desc = "Move to the first non-whitespace character" },
  { on = "u", run = "undo", desc = "Undo the last operation" },

  { on = "<C-A>", run = "noop" },
  { on = "<C-E>", run = "noop" },
  { on = "<Left>", run = "noop" },
  { on = "<Right>", run = "noop" },
  { on = "<C-b>", run = "noop" },
  { on = "<C-f>", run = "noop" },
  { on = "<A-b>", run = "noop" },
  { on = "<A-f>", run = "noop" },
  { on = "$", run = "noop" },
  { on = "_", run = "noop" },
  { on = "^", run = "noop" },
  { on = "<C-a>", run = "noop" },
  { on = "<C-e>", run = "noop" },
  { on = "<Home>", run = "noop" },
  { on = "<End>", run = "noop" },
  { on = "<C-h>", run = "noop" },
  { on = "<C-d>", run = "noop" },
]

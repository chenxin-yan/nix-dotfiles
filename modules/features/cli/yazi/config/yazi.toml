#:schema https://yazi-rs.github.io/schemas/yazi.json

# Only changes to yazi's preset (yazi-config/preset/yazi-default.toml upstream).

[mgr]
linemode = "size"

# For the git plugin (its README).
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

# Noctalia v5. Reference: https://docs.noctalia.dev/noctalia/configuration/
# Check edits with `noctalia config validate`.

[shell]
font_family = "Geist"
# The shell answers polkit prompts (1Password, pkexec); niri ships no agent.
polkit_agent = true
telemetry_enabled = false

[theme]
mode = "dark"
# The fleet palette (modules/features/theme.nix). The built-in "Catppuccin"
# uses Mauve; this catalog palette is Mocha with Lavender. Downloaded once,
# then cached.
source = "community"
community_palette = "Catppuccin Mocha Lavender"

# Apps are themed by catppuccin/nix; two theming systems would fight.
[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

# Blurred wallpaper behind niri's overview (layer-rule in niri's config.kdl).
[backdrop]
enabled = true

[lockscreen]
fingerprint = true
lock_before_suspend = true

[idle]
behavior_order = ["lock", "screen-off", "suspend"]

[idle.behavior.lock]
timeout = 300
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"
enabled = true

[idle.behavior.suspend]
timeout = 1200
action = "lock_and_suspend"
enabled = true

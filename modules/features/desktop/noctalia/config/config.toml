# Noctalia v5. Reference: https://docs.noctalia.dev/noctalia/configuration/
# Check edits with `noctalia config validate`.

# font_family defaults to fontconfig's sans-serif: Geist (fonts feature).
[shell]
# The shell answers polkit prompts (1Password, pkexec); niri ships no agent.
polkit_agent = true
# This file is the setup; don't open the first-run wizard on a fresh profile.
setup_wizard_enabled = false

# Keep the login screen's wallpaper and palette in step with the shell's
# (allowed without a password by noctalia/default.nix).
[shell.greeter_sync]
auto_sync = true

# Idle, the session menu and IPC suspend like the lid does (logind, in
# hosts/framework): hibernate before the battery runs out.
[shell.session.power]
suspend = "systemctl suspend-then-hibernate"

[theme]
# The fleet palette (modules/features/theme.nix). The built-in "Catppuccin"
# uses Mauve; this catalog palette is Mocha with Lavender. Downloaded and
# cached; fetched again when the catalog changes.
source = "community"
community_palette = "Catppuccin Mocha Lavender"

# Apps are themed by catppuccin/nix; two theming systems would fight.
[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

# Installed by noctalia/default.nix. Picking another in the wallpaper panel
# saves to settings.toml, which overrides this.
[wallpaper.default]
path = "~/Pictures/Wallpapers/jungle-cats-hideaway.jpg"

# Blurred wallpaper behind niri's overview (layer-rule in niri's config.kdl).
[backdrop]
enabled = true

[idle]
behavior_order = ["lock", "screen-off", "suspend"]

[idle.behavior.lock]
timeout = 300
action = "lock"

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"

[idle.behavior.suspend]
timeout = 1200
action = "lock_and_suspend"

[bar.default]
position = "left"
thickness = 32
margin_edge = 8
margin_ends = 8
radius = 10
start = ["workspaces"]
center = ["clock"]
end = ["media", "tray", "notifications", "battery", "control-center"]

[widget.clock]
format = "{:%I:%M}"

[widget.workspaces]
style = "regular"
empty_color = "surface_variant"

# Lock screen: a large clock, the date, and a bare password field over the
# blurred wallpaper. The noctalia-greeter settings in default.nix match it.
# Positions are logical px on eDP-1 (1646x1097). Leaving the lock screen
# widget editor saves its whole layout to settings.toml, which then overrides
# this section; delete [lockscreen_widgets] there after using it.
[lockscreen]
transition = ["fade"]
transition_duration = 500
blur_intensity = 0.8
tint_intensity = 0.45

[lockscreen_widgets]
enabled = true
widget_order = ["lock-time", "lock-date", "lockscreen-login-box@eDP-1"]

[lockscreen_widgets.widget.lock-time]
type = "clock"
output = "eDP-1"
cx = 823.0
cy = 400.0
box_width = 520.0
box_height = 170.0

[lockscreen_widgets.widget.lock-time.settings]
format = "{:%-I:%M}"
center_text = true
background = false
shadow = false
color = "on_surface"

[lockscreen_widgets.widget.lock-date]
type = "clock"
output = "eDP-1"
cx = 823.0
cy = 500.0
box_width = 360.0
box_height = 36.0

[lockscreen_widgets.widget.lock-date.settings]
format = "{:%A, %B %-d}"
center_text = true
background = false
shadow = false
color = "on_surface_variant"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
output = "eDP-1"
cx = 823.0
cy = 860.0

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
# Compact drops the media, weather and session-button rows.
layout = "compact"
show_login_button = false
show_keyboard_layout = false
center_password_text = true
# The "type your password" card above the field; errors and Caps Lock still
# show.
show_unlock_hint = false
background_opacity = 0.6

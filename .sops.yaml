# Who can decrypt what. Public keys only: the recovery key's private half is
# the 1Password document sops-recovery, and each host decrypts with its SSH
# host key (`ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub`). After editing,
# run `just secrets-rekey`.
keys:
  - &recovery age1uer6slgawhqvrymlsw8q57jrqa23xy2vh9zhfmx2dvmk6s7x8qgqrgznpc
  - &macbook age1yeuv33dakryxdafumktpd0dshzhrpexhg9z87g9axvz6uu4mds8qfqrxjv
  - &minipc age148a4a983sdpqmxsh02akhnze2mxccgf5q9t7maddj0wg6t3hyc8snqztkw
creation_rules:
  # Keys every machine uses.
  - path_regex: ^secrets/shared\.yaml$
    age: [*recovery, *macbook, *minipc]
